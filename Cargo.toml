[workspace]
resolver = "2"
members = ["crates/ultraviewer-protocol", "crates/linuxviewer"]
# A local checkout of the original macOS project (not part of this repository).
exclude = ["MacViewer"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["thehieucf"]
repository = "https://github.com/thehieucf/LinuxViewer"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

# Screen decoding is CPU-bound; keep debug builds usable for local testing.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
