[package]
name = "ultraviewer-protocol"
description = "UltraViewer-compatible protocol engine: crypto, relay, screen codec, audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
aes = "0.8"
des = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
thiserror = "2"
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# System OpenSSL: some UltraViewer relays only offer TLS 1.2 CBC suites.
openssl = "0.10"
tokio-openssl = "0.6"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
env_logger = "0.11"
serde_json = "1"
base64 = "0.22"
